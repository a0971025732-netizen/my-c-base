[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finch-harness"
version = "0.1.0"
description = "Finch outbound growth harness: discover conversations, draft disclosed contextual comments, human-approve, publish, measure, optimize."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
x = ["tweepy>=4.14"]
llm = ["anthropic>=0.70"]
all = ["praw>=7.7", "tweepy>=4.14", "anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
finch = "finch_harness.cli:main"

[tool.setuptools.packages.find]
include = ["finch_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
