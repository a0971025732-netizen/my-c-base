# STRATEGY LAYER — baseline parameters.
# These are starting values. `finch analyze` writes recommended overrides to
# the campaign memory; promote them here once a TEST finding is confirmed.

campaign:
  candidates_target: [40, 60]
  qualified_target: [12, 16]
  publish_target: [5, 8]
  publish_max: 15
  qualify_min_score: 60          # opportunity score (0-100) needed to be "qualified"
  max_per_community: 2           # published comments per subreddit / X topic per campaign
  platform_mix: {reddit: 0.7, x: 0.3}

discovery:
  reddit:
    time_filter: week            # hour | day | week | month
    sort: new
    per_query_limit: 25
    seed_subreddits: []          # filled per agent by the profile builder
  x:
    max_results: 25
    lang: en
    exclude: ["-is:retweet"]
  max_post_age_hours: 168
  intent_types:
    - question
    - tool_recommendation
    - workflow_discussion
    - technical_discussion
    - industry_discussion
    - comparison
    - experience_sharing
    - project_building
    - educational
    - emerging

scoring_weights:               # must sum to 100
  relevance: 25
  intent: 20
  freshness: 15
  momentum: 10
  audience_fit: 10
  agent_fit: 15
  naturalness: 5

freshness_curve_hours:         # age -> fraction of freshness points
  - [6, 1.0]
  - [24, 0.85]
  - [72, 0.6]
  - [168, 0.3]
  - [100000, 0.0]

quality_gate:
  min_total: 28                # of 35
  max_promotional_intensity: 2
  min_agent_fit: 4
  min_conversation_fit: 4
  max_similarity_to_history: 0.55
  require_disclosure: false   # mention Finch affiliation only when it reads naturally
  max_rewrites: 2

comment_styles:
  - direct_answer              # answer the question, mention agent as one option
  - workflow_walkthrough       # step-by-step how I'd do it, agent in one step
  - comparison                 # tradeoffs between approaches incl. the agent
  - experience_share           # what worked for us
  - resource_list              # 2-4 resources, agent is one of them
  - clarifying_plus_tip        # ask a clarifying question + give a tip

disclosure_templates:        # optional phrasing, use only when natural in context
  - "(Disclosure: I'm with Finch.)"
  - "Full disclosure, I work on Finch."
  - "(I help build agents on Finch, so I'm biased.)"

llm:
  model: claude-opus-5
  effort: medium

# ── Moltbook TEST overrides (from flowcredit r3 T+24h analysis, 2026-09-28) ──
# Status: TEST. Sample so far ~10 comments; promote to defaults only after >=3
# clean samples confirm. Rationale in runs/flowcredit-r3/review.md.
moltbook:
  # Finding 1: likes are a near-dead signal on Moltbook (even OPs get 2-10).
  # The real efficacy signal is whether the original poster replies substantively.
  efficacy_metric: po_substantive_reply    # replaces "likes >= 2" as primary L2
  likes_threshold: 1                        # was 2; kept only as a weak secondary
  po_reply_is_success: true
  # Finding 2: engagement came only from posts whose author was still active in
  # the thread. Weight author activity/answerability in selection.
  select_weight_author_active: high
  prefer_posts_where_op_still_replying: true
  # Finding 3: token-rant / crypto-sovereignty authors engage but combatively and
  # off-thesis (evidence-first framing reads to them as "surveillance").
  deprioritize_author_archetypes:
    - crypto_sovereignty_maximalist
    - utility_token_is_a_scam_ranter
  prefer_author_archetypes:
    - operations_evidence_builder     # e.g. creditclaw, bitroadai, grokfreeagent, shinegang-adjacent
    - real_revenue_ledger_publisher

# ── Moltbook optimization pass (from 42-comment cross-round analysis, 2026-10-01) ──
# Data: PO-substantive-reply rate (our L2). See runs/analyze_all.py + analyze_snapshot.json.
# Confidence: community/mode/batch-size cuts are well-sampled; usdc & agentcommerce are n=2.
moltbook_v2:
  # Finding A: community predicts engagement far more than the composite score.
  #   agentfinance 50% (8/16), usdc 100%* / agentcommerce 50%* (small n),
  #   security 30% (3/10), crypto 16% (2/12). Concentrate where replies happen.
  community_reply_rate:        # observed PO-reply%, use as a selection prior
    agentfinance: 0.50
    usdc: 1.00                 # n=2, treat as provisional
    agentcommerce: 0.50        # n=2, provisional
    security: 0.30
    crypto: 0.16
  community_allocation:
    prefer: [agentfinance, usdc, agentcommerce]
    cap_per_round:
      crypto: 2                # was the biggest bucket, worst reply rate
      security: 2              # only when genuinely on-topic, not filler
  # Finding B: Mode A (direct answer to a question) 60% vs Mode D (discussion) 34%.
  #   83% of comments were Mode D by default. Actively hunt question/ask posts.
  prefer_posts_that_ask: true   #求助 / "any tool for" / comparison / question-ending
  target_mode_mix: {A_or_B: ">=0.4", D: "<=0.6"}
  # Finding C: tight small batches beat big widened ones (7-8 => 50-57%, 15 => 26%).
  default_batch_size: [6, 8]
  avoid_widening_to_hit_a_number: true   # fewer high-fit > padded volume
  # Finding D: likes are dead (5 likes / 42 comments). Retire as a metric.
  likes_metric: retired
  primary_success_metric: po_substantive_reply
  # Finding E (TEST): composite Opportunity Score does NOT separate engagement
  #   (>=70 and 60-69 both 40%). Reweight toward signals that do.
  score_reweight_test:
    up: [intent_question_present, community_historical_reply_rate]
    down: [raw_freshness, raw_relevance]
    status: TEST               # needs >=3 more clean samples before promoting
